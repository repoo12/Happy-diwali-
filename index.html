<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            z-index: 10;
            position: relative;
        }

        .diwali-title {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: #ff6600;
            display: flex;
            flex-direction: column;
            line-height: 0.9;
        }

        .happy {
            font-size: 6rem;
            color: #ff9933;
            text-shadow: 3px 3px 0px #ffcc00;
            margin-bottom: 10px;
        }

        .diwali {
            font-size: 6rem;
            color: #ff6600;
            text-shadow: 3px 3px 0px #ff9933;
            margin-top: -20px;
        }

        .greeting {
            font-size: 2rem;
            margin-bottom: 2.5rem;
            color: #ff6600;
            font-family: 'Arial', sans-serif;
            line-height: 1.5;
            padding: 15px;
            background-color: rgba(255, 204, 0, 0.2);
            border-radius: 15px;
            display: inline-block;
        }

        .share-section {
            margin-top: 2rem;
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .share-btn {
            background: linear-gradient(135deg, #ff9933 0%, #ff6600 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(255, 153, 51, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 153, 51, 0.6);
        }

        .share-btn i {
            margin-right: 10px;
        }

        .share-count {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ff6600;
            font-weight: bold;
        }

        .firecracker {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .diya {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff9933 0%, #ff6600 70%);
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 20px #ff6600;
            animation: flicker 2s infinite alternate;
        }

        .diya::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: #ffcc00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffcc00;
        }

        @keyframes flicker {
            0%, 100% {
                opacity: 0.8;
                box-shadow: 0 0 15px #ff6600;
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 25px #ff6600, 0 0 35px #ff6600;
            }
        }

        .diyas {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .rangoli {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 204, 0, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 153, 51, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 70%, rgba(255, 102, 0, 0.2) 0%, transparent 50%);
            z-index: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            transition: transform 0.3s;
        }

        .social-icon:hover {
            transform: scale(1.2);
        }

        .facebook { background-color: #3b5998; }
        .whatsapp { background-color: #25D366; }
        .instagram { background-color: #E4405F; }
        .twitter { background-color: #1DA1F2; }
        .tiktok { background-color: #000000; }

        @media (max-width: 768px) {
            .happy, .diwali {
                font-size: 4rem;
            }
            
            .greeting {
                font-size: 1.5rem;
            }
            
            .share-btn {
                padding: 12px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="rangoli"></div>
    
    <div class="diyas">
        <div class="diya" style="left: 10%;"></div>
        <div class="diya" style="left: 30%;"></div>
        <div class="diya" style="left: 50%;"></div>
        <div class="diya" style="left: 70%;"></div>
        <div class="diya" style="left: 90%;"></div>
    </div>

    <div class="container">
        <h1 class="diwali-title">
            <span class="happy">Happy</span>
            <span class="diwali">Diwali</span>
        </h1>
        <p class="greeting">✨तिमी र तिम्रो परिवारलाई दीपावलीको धेरै धेरै शुभकामना!✨</p>
        
        <div class="share-section">
            <button class="share-btn" id="shareButton">
                <i class="fas fa-share-alt"></i> Share
            </button>
            <div class="share-count">22k shares</div>
            
            <div class="social-icons">
                <div class="social-icon facebook">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="social-icon instagram">
                    <i class="fab fa-instagram"></i>
                </div>
                <div class="social-icon twitter">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon tiktok">
                    <i class="fab fa-tiktok"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firecracker animation on page load
        document.addEventListener('DOMContentLoaded', function() {
            createFirecrackers();
            
            // Share button functionality
            document.getElementById('shareButton').addEventListener('click', function() {
                if (navigator.share) {
                    navigator.share({
                        title: 'Happy Diwali',
                        text: '✨तिमी र तिम्रो परिवारलाई दीपावलीको धेरै धेरै शुभकामना!✨',
                        url: window.location.href
                    })
                    .then(() => console.log('Successful share'))
                    .catch((error) => console.log('Error sharing:', error));
                } else {
                    // Fallback for browsers that don't support Web Share API
                    const shareText = 'Happy Diwali! ✨तिमी र तिम्रो परिवारलाई दीपावलीको धेरै धेरै शुभकामना!✨';
                    const shareUrl = window.location.href;
                    
                    // Copy to clipboard as fallback
                    navigator.clipboard.writeText(`${shareText} ${shareUrl}`)
                        .then(() => {
                            alert('Diwali greeting copied to clipboard! Share it with your friends and family.');
                        })
                        .catch(err => {
                            alert(`Share this Diwali greeting: ${shareText} ${shareUrl}`);
                        });
                }
            });
            
            // Add click events to social icons
            document.querySelectorAll('.social-icon').forEach(icon => {
                icon.addEventListener('click', function() {
                    const platform = this.classList[1];
                    const shareText = 'Happy Diwali! ✨तिमी र तिम्रो परिवारलाई दीपावलीको धेरै धेरै शुभकामना!✨';
                    const shareUrl = window.location.href;
                    
                    let shareLink = '';
                    
                    switch(platform) {
                        case 'facebook':
                            shareLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}&quote=${encodeURIComponent(shareText)}`;
                            break;
                        case 'twitter':
                            shareLink = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
                            break;
                        case 'whatsapp':
                            shareLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
                            break;
                        case 'instagram':
                            alert('To share on Instagram, copy the link and paste it in your Instagram story or post.');
                            navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
                            return;
                        case 'tiktok':
                            alert('To share on TikTok, copy the link and paste it in your TikTok video description.');
                            navigator.clipboard.writeText(`${shareText} ${shareUrl}`);
                            return;
                    }
                    
                    window.open(shareLink, '_blank', 'width=600,height=400');
                });
            });
        });

        function createFirecrackers() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const firecracker = document.createElement('div');
                    firecracker.classList.add('firecracker');
                    
                    const startX = Math.random() * window.innerWidth;
                    const startY = window.innerHeight + 20;
                    
                    firecracker.style.left = startX + 'px';
                    firecracker.style.top = startY + 'px';
                    firecracker.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    document.body.appendChild(firecracker);
                    
                    // Animate firecracker going up
                    const animation = firecracker.animate([
                        { transform: 'translateY(0)', opacity: 1 },
                        { transform: `translateY(-${Math.random() * 300 + 200}px)`, opacity: 1 }
                    ], {
                        duration: Math.random() * 1000 + 500,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    });
                    
                    animation.onfinish = () => {
                        // Create explosion
                        createExplosion(parseFloat(firecracker.style.left), parseFloat(firecracker.style.top) - (Math.random() * 300 + 200));
                        firecracker.remove();
                    };
                }, i * 100);
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 100 + 50;
                const duration = Math.random() * 1000 + 500;
                
                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px) scale(0)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                });
                
                setTimeout(() => {
                    particle.remove();
                }, duration);
            }
        }
    </script>
</body>
</html>
